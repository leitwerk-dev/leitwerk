name: Validate application
description: Build and validate the checked-out application and publishable packages
inputs:
  source-sha:
    description: Source revision used for the build cache
    default: ${{ github.sha }}
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26
        cache: npm

    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.x'
        cache: pip
        cache-dependency-path: requirements-docs.txt

    - name: Restore Turbo build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ inputs.source-sha }}
        restore-keys: |
          turbo-${{ runner.os }}-

    - name: Install npm dependencies
      shell: bash
      run: npm ci

    - name: Check public npm package registration
      shell: bash
      run: npm run publish:registration

    - name: Install Playwright browser dependencies
      # Cold hosted runners can spend several minutes downloading OS fonts and libraries.
      shell: bash
      run: timeout 15m npx playwright install --with-deps chromium firefox webkit

    - name: Install documentation dependencies
      shell: bash
      run: python -m pip install -r requirements-docs.txt

    - name: Run full test gate
      shell: bash
      run: npm run test:full

    - name: Check API classification and interface reports
      shell: bash
      run: npm run api:check

    - name: Build documentation
      shell: bash
      run: npm run docs:build

    - name: Dry-run npm package contents
      shell: bash
      run: npm run publish:dry-run
