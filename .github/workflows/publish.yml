name: Publish npm packages

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the publish workflow without publishing packages
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish workspaces
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Run full test gate
        run: npm run test:full

      - name: Build documentation
        run: npm run docs:build

      - name: Dry-run npm package contents
        run: npm run publish:dry-run

      - name: Publish npm packages
        if: ${{ github.event_name == 'release' || inputs.dry_run == false }}
        run: npm run publish:workspaces
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
