name: Publish release artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Release Please tag to resume, for example v0.1.0
        required: true
        type: string

env:
  DO_NOT_TRACK: '1'
  SCARF_ANALYTICS: 'false'
  TURBO_DISABLE_UPDATE_CHECK: '1'
  TURBO_TELEMETRY_DISABLED: '1'

concurrency:
  group: publish-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      git_sha: ${{ steps.release.outputs.git_sha }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Resolve release coordinates
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Stable release version must be X.Y.Z: $version" >&2
            exit 1
          }
          [[ "$RELEASE_TAG" == "v$version" ]] || {
            echo "Release tag $RELEASE_TAG must exactly match v$version" >&2
            exit 1
          }
          {
            echo "version=$version"
            echo "tag=$RELEASE_TAG"
            echo "git_sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Reject a conflicting release lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_GIT_SHA: ${{ steps.release.outputs.git_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts/existing-lock
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' \
            | grep -Fxq 'leitwerk-base.lock.yaml'; then
            gh release download "$RELEASE_TAG" \
              --pattern leitwerk-base.lock.yaml \
              --dir release-artifacts/existing-lock
            locked_sha="$(awk '$1 == "public_git_sha:" { print $2 }' \
              release-artifacts/existing-lock/leitwerk-base.lock.yaml)"
            [[ "$locked_sha" == "$RELEASE_GIT_SHA" ]] || {
              echo "Release lock belongs to Git revision $locked_sha, not $RELEASE_GIT_SHA" >&2
              exit 1
            }
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Validate lockstep release configuration
        run: npm run release:check

      - name: Run full test gate
        run: npm run test:full

      - name: Build documentation
        run: npm run docs:build

      - name: Dry-run npm package contents
        run: npm run publish:dry-run

      - name: Upload validated publishable contents
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publishable-${{ steps.release.outputs.git_sha }}
          path: |
            packages/*/dist
            extensions/*/dist
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  inspect-images:
    name: Inspect existing image tags
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      server_build: ${{ steps.images.outputs.server_build }}
      server_digest: ${{ steps.images.outputs.server_digest }}
      server_version_exists: ${{ steps.images.outputs.server_version_exists }}
      server_sha_exists: ${{ steps.images.outputs.server_sha_exists }}
      worker_build: ${{ steps.images.outputs.worker_build }}
      worker_digest: ${{ steps.images.outputs.worker_digest }}
      worker_version_exists: ${{ steps.images.outputs.worker_version_exists }}
      worker_sha_exists: ${{ steps.images.outputs.worker_sha_exists }}
    env:
      RELEASE_GIT_SHA: ${{ needs.validate.outputs.git_sha }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Inspect and validate immutable image tags
        id: images
        shell: bash
        run: |
          set -euo pipefail

          inspect_digest() {
            local reference="$1"
            local error_file="$RUNNER_TEMP/image-inspect-error"
            local manifest
            if manifest="$(docker buildx imagetools inspect "$reference" \
              --format '{{json .Manifest}}' 2>"$error_file")"; then
              jq -r '.digest' <<<"$manifest"
              return
            fi
            if grep -Eqi 'not found|manifest unknown|name unknown|404' "$error_file"; then
              return
            fi
            cat "$error_file" >&2
            exit 1
          }

          validate_image() {
            local reference="$1"
            local manifest
            manifest="$(docker buildx imagetools inspect "$reference" \
              --format '{{json .Manifest}}')"
            for architecture in amd64 arm64; do
              jq -e --arg architecture "$architecture" \
                'any(.manifests[]; .platform.os == "linux" and .platform.architecture == $architecture)' \
                <<<"$manifest" >/dev/null || {
                  echo "$reference does not contain linux/$architecture" >&2
                  exit 1
                }
              local image format
              format="{{json (index .Image \"linux/$architecture\")}}"
              image="$(docker buildx imagetools inspect "$reference" --format "$format")"
              jq -e --arg revision "$RELEASE_GIT_SHA" --arg version "$RELEASE_VERSION" '
                .config.Labels["org.opencontainers.image.revision"] == $revision and
                .config.Labels["org.opencontainers.image.version"] == $version
              ' <<<"$image" >/dev/null || {
                echo "$reference linux/$architecture belongs to another release" >&2
                exit 1
              }
            done
          }

          resolve_image() {
            local key="$1" repository="$2"
            local version_digest sha_digest selected_digest
            version_digest="$(inspect_digest "$repository:$RELEASE_VERSION")"
            sha_digest="$(inspect_digest "$repository:$RELEASE_GIT_SHA")"
            if [[ -n "$version_digest" ]]; then validate_image "$repository:$RELEASE_VERSION"; fi
            if [[ -n "$sha_digest" ]]; then validate_image "$repository:$RELEASE_GIT_SHA"; fi
            if [[ -n "$version_digest" && -n "$sha_digest" && "$version_digest" != "$sha_digest" ]]; then
              echo "$repository release and Git-SHA tags resolve to different digests" >&2
              exit 1
            fi
            selected_digest="${version_digest:-$sha_digest}"
            echo "${key}_build=$([[ -z "$selected_digest" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "${key}_digest=$selected_digest" >> "$GITHUB_OUTPUT"
            echo "${key}_version_exists=$([[ -n "$version_digest" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "${key}_sha_exists=$([[ -n "$sha_digest" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          }

          resolve_image server ghcr.io/leitwerk-dev/leitwerk-server
          resolve_image worker ghcr.io/leitwerk-dev/leitwerk-worker-generic

  build-images:
    name: Build images (${{ matrix.platform }})
    needs: [validate, inspect-images]
    if: >-
      needs.inspect-images.outputs.server_build == 'true' ||
      needs.inspect-images.outputs.worker_build == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_slug: linux-amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            platform_slug: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish server image by digest
        if: ${{ needs.inspect-images.outputs.server_build == 'true' }}
        id: server
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/images/Dockerfile.server
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/leitwerk-dev/leitwerk-server,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=leitwerk-server-${{ matrix.platform_slug }}
          cache-to: type=gha,mode=max,scope=leitwerk-server-${{ matrix.platform_slug }}
          labels: |
            org.opencontainers.image.revision=${{ needs.validate.outputs.git_sha }}
            org.opencontainers.image.source=https://github.com/leitwerk-dev/leitwerk
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}

      - name: Build and publish generic worker image by digest
        if: ${{ needs.inspect-images.outputs.worker_build == 'true' }}
        id: worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/images/Dockerfile.worker-generic
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/leitwerk-dev/leitwerk-worker-generic,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=leitwerk-worker-generic-${{ matrix.platform_slug }}
          cache-to: type=gha,mode=max,scope=leitwerk-worker-generic-${{ matrix.platform_slug }}
          labels: |
            org.opencontainers.image.revision=${{ needs.validate.outputs.git_sha }}
            org.opencontainers.image.source=https://github.com/leitwerk-dev/leitwerk
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}

      - name: Record platform image digests
        env:
          SERVER_DIGEST: ${{ steps.server.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          record_digest() {
            local key="$1" digest="$2"
            [[ -z "$digest" ]] && return
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
              echo "$key did not produce a valid digest: $digest" >&2
              exit 1
            }
            mkdir -p "release-digests/$key"
            touch "release-digests/$key/${digest#sha256:}"
          }
          record_digest server "$SERVER_DIGEST"
          record_digest worker "$WORKER_DIGEST"

      - name: Upload platform image digests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-digests-${{ matrix.platform_slug }}
          path: release-digests
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  merge-images:
    name: Assemble multi-architecture image manifests
    needs: [validate, inspect-images, build-images]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.inspect-images.result == 'success' &&
      (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      server_digest: ${{ steps.images.outputs.server_digest }}
      worker_digest: ${{ steps.images.outputs.worker_digest }}
    env:
      RELEASE_GIT_SHA: ${{ needs.validate.outputs.git_sha }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download platform image digests
        if: >-
          needs.inspect-images.outputs.server_build == 'true' ||
          needs.inspect-images.outputs.worker_build == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-digests-*
          path: release-digests
          merge-multiple: true

      - name: Assemble or complete immutable image tags
        id: images
        env:
          EXISTING_SERVER_DIGEST: ${{ needs.inspect-images.outputs.server_digest }}
          EXISTING_WORKER_DIGEST: ${{ needs.inspect-images.outputs.worker_digest }}
          SERVER_VERSION_EXISTS: ${{ needs.inspect-images.outputs.server_version_exists }}
          SERVER_SHA_EXISTS: ${{ needs.inspect-images.outputs.server_sha_exists }}
          WORKER_VERSION_EXISTS: ${{ needs.inspect-images.outputs.worker_version_exists }}
          WORKER_SHA_EXISTS: ${{ needs.inspect-images.outputs.worker_sha_exists }}
        shell: bash
        run: |
          set -euo pipefail

          inspect_digest() {
            docker buildx imagetools inspect "$1" \
              --format '{{json .Manifest}}' | jq -r '.digest'
          }

          validate_image() {
            local reference="$1"
            local manifest
            manifest="$(docker buildx imagetools inspect "$reference" \
              --format '{{json .Manifest}}')"
            for architecture in amd64 arm64; do
              jq -e --arg architecture "$architecture" \
                'any(.manifests[]; .platform.os == "linux" and .platform.architecture == $architecture)' \
                <<<"$manifest" >/dev/null || {
                  echo "$reference does not contain linux/$architecture" >&2
                  exit 1
                }
              local image format
              format="{{json (index .Image \"linux/$architecture\")}}"
              image="$(docker buildx imagetools inspect "$reference" --format "$format")"
              jq -e --arg revision "$RELEASE_GIT_SHA" --arg version "$RELEASE_VERSION" '
                .config.Labels["org.opencontainers.image.revision"] == $revision and
                .config.Labels["org.opencontainers.image.version"] == $version
              ' <<<"$image" >/dev/null || {
                echo "$reference linux/$architecture belongs to another release" >&2
                exit 1
              }
            done
          }

          assemble_image() {
            local key="$1" repository="$2" existing_digest="$3"
            local version_exists="$4" sha_exists="$5" digest="$existing_digest"
            if [[ -z "$digest" ]]; then
              local digest_dir="release-digests/$key"
              mapfile -t digest_files < <(find "$digest_dir" -mindepth 1 -maxdepth 1 -type f | sort)
              [[ "${#digest_files[@]}" -eq 2 ]] || {
                echo "$repository requires exactly two platform digests" >&2
                exit 1
              }
              local references=()
              for digest_file in "${digest_files[@]}"; do
                local digest_hex
                digest_hex="$(basename "$digest_file")"
                [[ "$digest_hex" =~ ^[a-f0-9]{64}$ ]] || {
                  echo "$repository has an invalid platform digest: $digest_hex" >&2
                  exit 1
                }
                references+=("$repository@sha256:$digest_hex")
              done
              docker buildx imagetools create \
                --tag "$repository:$RELEASE_VERSION" \
                --tag "$repository:$RELEASE_GIT_SHA" \
                "${references[@]}"
              digest="$(inspect_digest "$repository:$RELEASE_VERSION")"
            else
              if [[ "$version_exists" == false ]]; then
                docker buildx imagetools create \
                  --tag "$repository:$RELEASE_VERSION" "$repository@$digest"
              fi
              if [[ "$sha_exists" == false ]]; then
                docker buildx imagetools create \
                  --tag "$repository:$RELEASE_GIT_SHA" "$repository@$digest"
              fi
            fi
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
              echo "$repository did not resolve to a valid digest" >&2
              exit 1
            }
            validate_image "$repository:$RELEASE_VERSION"
            [[ "$(inspect_digest "$repository:$RELEASE_GIT_SHA")" == "$digest" ]] || {
              echo "$repository release and Git-SHA tags resolve to different digests" >&2
              exit 1
            }
            echo "${key}_digest=$digest" >> "$GITHUB_OUTPUT"
          }

          assemble_image server ghcr.io/leitwerk-dev/leitwerk-server \
            "$EXISTING_SERVER_DIGEST" "$SERVER_VERSION_EXISTS" "$SERVER_SHA_EXISTS"
          assemble_image worker ghcr.io/leitwerk-dev/leitwerk-worker-generic \
            "$EXISTING_WORKER_DIGEST" "$WORKER_VERSION_EXISTS" "$WORKER_SHA_EXISTS"

  publish:
    name: Publish or resume public artifacts
    needs: [validate, merge-images]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
      packages: write
    env:
      RELEASE_GIT_SHA: ${{ needs.validate.outputs.git_sha }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      SERVER_DIGEST: ${{ needs.merge-images.outputs.server_digest }}
      WORKER_DIGEST: ${{ needs.merge-images.outputs.worker_digest }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Setup trusted-publishing Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.16.0

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4

      - name: Set up ORAS
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1

      - name: Install npm dependencies
        run: npm ci

      - name: Download validated publishable contents
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: publishable-${{ needs.validate.outputs.git_sha }}
          path: .

      - name: Preflight npm publication
        run: >-
          env GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG"
          npm run publish:preflight

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package, publish, or reuse digest-pinned Helm chart
        id: chart
        shell: bash
        run: |
          set -euo pipefail
          chart_oci="oci://ghcr.io/leitwerk-dev/charts/leitwerk"
          chart_registry="ghcr.io/leitwerk-dev/charts/leitwerk"
          mkdir -p release-artifacts/staged release-artifacts/new release-artifacts/existing
          node --import tsx scripts/prepare-release-chart.ts \
            --source deploy/kubernetes/helm/leitwerk \
            --destination release-artifacts/staged/leitwerk \
            --version "$RELEASE_VERSION" \
            --git-sha "$RELEASE_GIT_SHA" \
            --server-image "ghcr.io/leitwerk-dev/leitwerk-server@$SERVER_DIGEST" \
            --worker-image "ghcr.io/leitwerk-dev/leitwerk-worker-generic@$WORKER_DIGEST"
          helm lint release-artifacts/staged/leitwerk
          helm package release-artifacts/staged/leitwerk --destination release-artifacts/new

          error_file="$RUNNER_TEMP/helm-pull-error"
          if helm pull "$chart_oci" --version "$RELEASE_VERSION" \
            --destination release-artifacts/existing 2>"$error_file"; then
            mkdir -p release-artifacts/existing/unpacked
            tar -xzf "release-artifacts/existing/leitwerk-$RELEASE_VERSION.tgz" \
              -C release-artifacts/existing/unpacked
            node --import tsx scripts/verify-release-chart.ts \
              --chart-dir release-artifacts/existing/unpacked/leitwerk \
              --version "$RELEASE_VERSION" \
              --git-sha "$RELEASE_GIT_SHA" \
              --server-digest "$SERVER_DIGEST" \
              --worker-digest "$WORKER_DIGEST"
            chart_digest="$(oras manifest fetch --descriptor \
              "$chart_registry:$RELEASE_VERSION" | jq -r '.digest')"
            chart_archive="release-artifacts/existing/leitwerk-$RELEASE_VERSION.tgz"
          else
            if ! grep -Eqi 'not found|manifest unknown|name unknown|404' "$error_file"; then
              cat "$error_file" >&2
              exit 1
            fi
            chart_archive="release-artifacts/new/leitwerk-$RELEASE_VERSION.tgz"
            push_output="$(helm push "$chart_archive" oci://ghcr.io/leitwerk-dev/charts 2>&1)"
            printf '%s\n' "$push_output"
            chart_digest="$(sed -n 's/^Digest: //p' <<<"$push_output" | tail -n 1)"
          fi
          [[ "$chart_digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "Chart did not resolve to a valid digest" >&2
            exit 1
          }
          echo "archive=$chart_archive" >> "$GITHUB_OUTPUT"
          echo "digest=$chart_digest" >> "$GITHUB_OUTPUT"

      - name: Publish missing npm packages
        run: >-
          env GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG"
          npm run publish:workspaces

      - name: Verify anonymous reads and multi-architecture manifests
        shell: bash
        run: |
          set -euo pipefail
          helm registry logout ghcr.io || true
          docker logout ghcr.io || true
          for reference in \
            "ghcr.io/leitwerk-dev/leitwerk-server@$SERVER_DIGEST" \
            "ghcr.io/leitwerk-dev/leitwerk-worker-generic@$WORKER_DIGEST"; do
            manifest="$(docker buildx imagetools inspect "$reference" \
              --format '{{json .Manifest}}')"
            for architecture in amd64 arm64; do
              jq -e --arg architecture "$architecture" \
                'any(.manifests[]; .platform.os == "linux" and .platform.architecture == $architecture)' \
                <<<"$manifest" >/dev/null
            done
          done
          mkdir -p release-artifacts/anonymous-chart
          helm pull oci://ghcr.io/leitwerk-dev/charts/leitwerk \
            --version "$RELEASE_VERSION" \
            --destination release-artifacts/anonymous-chart
          npm_config_userconfig=/dev/null \
            GITHUB_REF_TYPE=tag \
            GITHUB_REF_NAME="$RELEASE_TAG" \
            npm run publish:verify

      - name: Record immutable release coordinates
        env:
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts/final
          {
            echo "schema_version: 1"
            echo "state: released"
            echo "version: $RELEASE_VERSION"
            echo "public_git_sha: $RELEASE_GIT_SHA"
            echo "npm_scope: '@leitwerk-dev'"
            echo "npm_version: $RELEASE_VERSION"
            echo "server_image: ghcr.io/leitwerk-dev/leitwerk-server@$SERVER_DIGEST"
            echo "worker_image: ghcr.io/leitwerk-dev/leitwerk-worker-generic@$WORKER_DIGEST"
            echo "chart_reference: oci://ghcr.io/leitwerk-dev/charts/leitwerk"
            echo "chart_version: $RELEASE_VERSION"
            echo "chart_digest: $CHART_DIGEST"
          } | tee release-artifacts/final/leitwerk-base.lock.yaml

      - name: Attach public release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "${{ steps.chart.outputs.archive }}" \
            release-artifacts/final/leitwerk-base.lock.yaml \
            --clobber

      - name: Upload release artifacts to workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leitwerk-${{ needs.validate.outputs.version }}-release-artifacts
          path: |
            ${{ steps.chart.outputs.archive }}
            release-artifacts/final/leitwerk-base.lock.yaml
