name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  DO_NOT_TRACK: '1'
  SCARF_ANALYTICS: 'false'
  TURBO_DISABLE_UPDATE_CHECK: '1'
  TURBO_TELEMETRY_DISABLED: '1'

permissions:
  contents: read

jobs:
  npm-registration:
    name: npm package registration
    if: github.event_name == 'pull_request' && github.head_ref == 'release-please--branches--main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Check public npm package registration
        run: npm run publish:registration

  validate:
    name: Full validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Restore Turbo build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browser dependencies
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Verify deployment tooling
        run: helm version --short

      - name: Build dependency image contracts
        run: |
          docker build --target dependencies -f deploy/images/Dockerfile.server .
          docker build --target dependencies -f deploy/images/Dockerfile.worker-generic .

      - name: Run full test gate
        run: npm run test:full
        env:
          LEITWERK_TEST_TIMINGS_FILE: ${{ runner.temp }}/test-runtime.json

      - name: Check API classification and interface reports
        run: npm run api:check

      - name: Build documentation
        run: npm run docs:build

      - name: Dry-run npm package contents
        run: npm run publish:dry-run

      - name: Save main test timings
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-runtime-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-runtime.json
          retention-days: 90
          if-no-files-found: warn

      - name: Compare test runtime with main
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/test-runtime.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          LEITWERK_TEST_TIMINGS_FILE: ${{ runner.temp }}/test-runtime.json
