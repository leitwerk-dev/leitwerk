name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  DO_NOT_TRACK: '1'
  SCARF_ANALYTICS: 'false'
  TURBO_DISABLE_UPDATE_CHECK: '1'
  TURBO_TELEMETRY_DISABLED: '1'

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Application validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify deployment tooling
        run: helm version --short

      - name: Validate application and package contents
        uses: ./.github/actions/validate-application
        env:
          LEITWERK_TEST_TIMINGS_FILE: ${{ runner.temp }}/test-runtime.json
          LEITWERK_TEST_REPORTS_DIR: ${{ runner.temp }}/test-reports

      - name: Upload test reports and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/test-reports/
            ${{ runner.temp }}/test-runtime.json
            test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Save main test timings
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-runtime-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-runtime.json
          retention-days: 90
          if-no-files-found: warn

      - name: Compare test runtime with main
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/test-runtime.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          LEITWERK_TEST_TIMINGS_FILE: ${{ runner.temp }}/test-runtime.json

  validate-images:
    name: Image validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container

      # One builder shares compilation layers between both Dockerfiles. Cache
      # scopes keep the two exports independent and fall back to main on new PRs.
      - name: Verify server image build stage
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: deploy/images/Dockerfile.server
          target: build
          outputs: type=cacheonly
          cache-from: |
            type=gha,scope=ci-server-${{ runner.os }}-${{ github.ref_name }}
            type=gha,scope=ci-server-${{ runner.os }}-main
          cache-to: type=gha,mode=max,scope=ci-server-${{ runner.os }}-${{ github.ref_name }}

      - name: Verify generic worker image build stage
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: deploy/images/Dockerfile.worker-generic
          target: build
          outputs: type=cacheonly
          cache-from: |
            type=gha,scope=ci-worker-generic-${{ runner.os }}-${{ github.ref_name }}
            type=gha,scope=ci-worker-generic-${{ runner.os }}-main
          cache-to: type=gha,mode=max,scope=ci-worker-generic-${{ runner.os }}-${{ github.ref_name }}

  full-validation:
    name: Full validation
    if: ${{ always() }}
    needs: [validate, validate-images]
    runs-on: ubuntu-latest
    steps:
      - name: Require application and image validation
        env:
          APPLICATION_RESULT: ${{ needs.validate.result }}
          IMAGES_RESULT: ${{ needs.validate-images.result }}
        run: |
          echo "Application validation: $APPLICATION_RESULT"
          echo "Image validation: $IMAGES_RESULT"
          [[ "$APPLICATION_RESULT" == success && "$IMAGES_RESULT" == success ]]
