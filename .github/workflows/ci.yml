name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  DO_NOT_TRACK: '1'
  SCARF_ANALYTICS: 'false'
  TURBO_DISABLE_UPDATE_CHECK: '1'
  TURBO_TELEMETRY_DISABLED: '1'

permissions:
  contents: read

jobs:
  npm-registration:
    name: npm package registration
    if: github.event_name == 'pull_request' && github.head_ref == 'release-please--branches--main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
      - name: Check public npm package registration
        run: npm run publish:registration

  validate:
    name: Full validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Restore Turbo build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright browser dependencies
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Verify deployment tooling
        run: helm version --short

      - name: Build dependency image contracts
        run: |
          docker build --target dependencies -f deploy/images/Dockerfile.server .
          docker build --target dependencies -f deploy/images/Dockerfile.worker-generic .

      - name: Run full test gate
        run: npm run test:full
        env:
          LEITWERK_TEST_TIMINGS_FILE: ${{ runner.temp }}/test-runtime.json

      - name: Check API classification and interface reports
        run: npm run api:check

      - name: Build documentation
        run: npm run docs:build

      - name: Dry-run npm package contents
        run: npm run publish:dry-run

      - name: Save main test timings
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-runtime-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-runtime.json
          retention-days: 90
          if-no-files-found: warn

      - name: Compare test runtime with main
        if: github.event_name == 'pull_request'
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/test-runtime.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          LEITWERK_TEST_TIMINGS_FILE: ${{ runner.temp }}/test-runtime.json
