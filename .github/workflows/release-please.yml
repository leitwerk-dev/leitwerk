name: Maintain release PR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DO_NOT_TRACK: '1'
  SCARF_ANALYTICS: 'false'
  TURBO_DISABLE_UPDATE_CHECK: '1'
  TURBO_TELEMETRY_DISABLED: '1'

concurrency:
  group: release-please-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Update or complete release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Update release PR or create release
        id: release
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
      - name: Promote overall release notes
        if: ${{ steps.release.outputs.release_created != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TARGET_BRANCH: main
        run: node scripts/update-release-pr-notes.mjs

  dispatch-publication:
    name: Start artifact publication
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Normalize the GitHub Release title
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: >-
          gh release edit "$RELEASE_TAG"
          --repo "$GITHUB_REPOSITORY"
          --title "$RELEASE_TAG"
      - name: Dispatch the trusted publication workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: >-
          gh workflow run publish.yml
          --repo "$GITHUB_REPOSITORY"
          --ref main
          --raw-field release_tag="$RELEASE_TAG"
