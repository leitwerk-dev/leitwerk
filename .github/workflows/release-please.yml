name: Maintain release PR

on:
  push:
    branches:
      - main

concurrency:
  group: release-please-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Update or complete release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Create narrow GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: leitwerk

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Render matching App bot DCO sign-off
        env:
          RELEASE_APP_ID: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          RELEASE_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: node scripts/render-release-please-config.mjs

      - name: Update release PR or create release
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .release-please-runtime-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
