{{- if .Values.exampleSecrets.enabled }}
# Example only. Prefer creating real Secrets outside source control and pass their
# names into worker runtime profiles or pod annotations as needed by your runner
# hardening layer.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "leitwerk.serverFullname" . }}-pi-example
  namespace: {{ include "leitwerk.namespace" . }}
  labels:
    {{- include "leitwerk.labels" . | nindent 4 }}
    app.kubernetes.io/component: example-secret
type: Opaque
stringData:
  {{- toYaml .Values.exampleSecrets.stringData | nindent 2 }}
{{- end }}
