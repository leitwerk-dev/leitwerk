{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "leitwerk.gatewayFullname" . }}
  namespace: {{ include "leitwerk.namespace" . }}
  labels:
    {{- include "leitwerk.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with .Values.gateway.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "leitwerk.gatewaySelectorLabels" . | nindent 4 }}
{{- end }}
